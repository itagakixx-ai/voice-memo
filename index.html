<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="声で残して、あとで確認できるシンプルな音声メモ">
  <title>声メモ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">VOICE NOTE</p><h1>声メモ</h1></div>
      <span class="local-badge">端末内保存</span>
    </header>

    <section class="recorder" aria-labelledby="recorder-heading">
      <h2 id="recorder-heading" class="sr-only">音声を録音</h2>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span><span id="status-text">タップして話してください</span>
      </div>
      <button id="record-button" class="record-button" type="button" aria-pressed="false">
        <span class="record-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V5a3.5 3.5 0 1 0-7 0v7a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
        </span>
        <span id="record-label">録音開始</span>
      </button>
      <p id="support-message" class="support-message">音声は文字としてメモに追加されます</p>
    </section>

    <section class="draft" aria-labelledby="draft-heading">
      <div class="section-heading"><h2 id="draft-heading">文字起こし</h2><button id="clear-button" class="text-button" type="button">クリア</button></div>
      <label class="sr-only" for="transcript">文字起こし結果</label>
      <textarea id="transcript" rows="5" placeholder="ここに文字起こし結果が表示されます。直接修正することもできます。"></textarea>
      <button id="save-button" class="save-button" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5V4Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>メモを保存
      </button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <section class="memo-section" aria-labelledby="memo-heading">
      <div class="section-heading memo-heading-row"><h2 id="memo-heading">保存したメモ</h2><span id="memo-count" class="memo-count">0件</span></div>
      <div class="memo-filters" role="group" aria-label="メモの絞り込み">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">未対応</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">完了</button>
      </div>
      <div id="memo-list"></div>
    </section>
    <section class="diagnostic-section" aria-labelledby="diagnostic-heading">
      <button id="diagnostic-toggle" class="diagnostic-toggle" type="button" aria-expanded="false" aria-controls="diagnostic-panel">音声認識の診断</button>
      <div id="diagnostic-panel" class="diagnostic-panel" hidden>
        <div class="notification-test">
          <button id="notification-test-button" type="button">通知をテスト</button>
          <p id="notification-test-result" role="status" aria-live="polite"></p>
        </div>
        <h2 id="diagnostic-heading">音声認識 診断ログ</h2>
        <pre id="diagnostic-log">録音を開始すると、ここに認識イベントが表示されます。</pre>
      </div>
    </section>  </main>

  <template id="memo-template">
    <article class="memo-card">
      <div class="memo-card-top"><time class="memo-date"></time><button class="status-button" type="button"></button></div>
      <p class="memo-text"></p>
      <textarea class="edit-textarea" rows="4" aria-label="メモ本文を編集" hidden></textarea>
      <div class="memo-actions">
        <button class="edit-button" type="button">編集</button>
        <button class="delete-button" type="button" aria-label="このメモを削除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>削除</button>
      </div>
      <div class="edit-actions" hidden><button class="cancel-edit-button" type="button">キャンセル</button><button class="save-edit-button" type="button">変更を保存</button></div>
    </article>
  </template>
  <script src="app.js" defer></script>
</body>
</html>
