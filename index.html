<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="声で残して、あとで確認できるシンプルな音声メモ">
  <title>声メモ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">VOICE NOTE</p><h1>声メモ</h1></div>
      <span class="local-badge">端末内保存</span>
    </header>

    <section class="recorder" aria-labelledby="recorder-heading">
      <h2 id="recorder-heading" class="sr-only">音声を録音</h2>
      <div id="status" class="status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span><span id="status-text">タップして話してください</span>
      </div>
      <button id="record-button" class="record-button" type="button" aria-pressed="false">
        <span class="record-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 0 0 3.5-3.5V5a3.5 3.5 0 1 0-7 0v7a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
        </span>
        <span id="record-label">録音開始</span>
      </button>
      <p id="support-message" class="support-message">音声は文字としてメモに追加されます</p>
    </section>

    <section class="draft" aria-labelledby="draft-heading">
      <div class="section-heading"><h2 id="draft-heading">文字起こし</h2><button id="clear-button" class="text-button" type="button">クリア</button></div>
      <label class="sr-only" for="transcript">文字起こし結果</label>
      <textarea id="transcript" rows="5" placeholder="ここに文字起こし結果が表示されます。直接修正することもできます。"></textarea>
      <div class="task-fields" aria-label="メモの属性">
        <label>期限<select id="draft-due"><option value="none">期限なし</option><option value="today">今日</option><option value="tomorrow">明日</option><option value="this_week">今週</option><option value="custom">日時指定</option></select></label>
        <label id="draft-period-label">時間帯<select id="draft-due-period"><option value="all_day">指定なし</option><option value="morning">午前</option><option value="afternoon">午後</option><option value="exact">時刻指定</option></select></label>
        <label id="draft-time-label" hidden>時刻<input id="draft-due-time" type="time" step="60"></label>
        <label id="draft-custom-date-label" hidden>日付<input id="draft-custom-date" type="date"></label>
        <label id="draft-custom-time-label" hidden>時刻（任意）<input id="draft-custom-time" type="time" step="60"></label>
        <label>優先度<select id="draft-priority"><option value="urgent">急ぎ</option><option value="normal" selected>通常</option><option value="low">低め</option></select></label>
        <label>種別<select id="draft-category"><option value="repair">修理</option><option value="estimate">見積</option><option value="visit">訪問</option><option value="inspection">点検</option><option value="contact">連絡</option><option value="order">発注</option><option value="other" selected>その他</option></select></label>
      </div>
      <div class="parser-actions">
        <button id="reparse-button" class="text-button" type="button" disabled>原文から再解析</button>
        <span id="parser-status" role="status" aria-live="polite"></span>
      </div>
      <button id="save-button" class="save-button" type="button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5V4Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg>メモを保存
      </button>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </section>

    <div class="view-tabs" role="tablist" aria-label="メモの表示方法">
      <button id="today-tab" class="view-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="today-view" tabindex="0">今日</button>
      <button id="list-tab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="list-view" tabindex="-1">一覧</button>
      <button id="calendar-tab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="calendar-view" tabindex="-1">カレンダー</button>
    </div>

    <section id="today-view" class="today-section" role="tabpanel" aria-labelledby="today-tab">
      <div class="today-heading"><div><p class="eyebrow">TODAY</p><h2>今日の業務</h2></div><time id="today-date"></time></div>
      <section class="dashboard-block" aria-labelledby="today-schedule-heading">
        <div class="dashboard-block-heading"><h3 id="today-schedule-heading">今日の予定</h3><span id="today-schedule-count" class="dashboard-count">0件</span></div>
        <div id="today-schedule-list"></div>
      </section>
      <section class="dashboard-block" aria-labelledby="in-progress-heading">
        <div class="dashboard-block-heading"><h3 id="in-progress-heading">対応中</h3><span id="in-progress-count" class="dashboard-count">0件</span></div>
        <div id="in-progress-list"></div>
      </section>
      <section class="dashboard-block" aria-labelledby="urgent-heading">
        <div class="dashboard-block-heading"><h3 id="urgent-heading">急ぎ</h3><span id="urgent-count" class="dashboard-count">0件</span></div>
        <div id="urgent-list"></div>
      </section>
      <section class="dashboard-block" aria-labelledby="dashboard-week-heading">
        <div class="dashboard-block-heading"><h3 id="dashboard-week-heading">今週タスク</h3><span id="dashboard-week-count" class="dashboard-count">0件</span></div>
        <div id="dashboard-week-list"></div>
      </section>
      <section class="dashboard-block" aria-labelledby="tomorrow-heading">
        <div class="dashboard-block-heading"><h3 id="tomorrow-heading">明日の予定</h3><span id="tomorrow-count" class="dashboard-count">0件</span></div>
        <div id="tomorrow-list"></div>
      </section>
    </section>

    <section id="list-view" class="memo-section" role="tabpanel" aria-labelledby="list-tab" hidden>
      <div class="section-heading memo-heading-row"><h2 id="memo-heading">保存したメモ</h2><span id="memo-count" class="memo-count">0件</span></div>
      <div class="memo-filters" role="group" aria-label="メモの絞り込み">
        <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">未対応</button>
        <button class="filter-button" type="button" data-filter="in_progress" aria-pressed="false">対応中</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">完了</button>
      </div>
      <div id="memo-list"></div>
    </section>

    <section id="calendar-view" class="calendar-section" role="tabpanel" aria-labelledby="calendar-tab" hidden>
      <div class="calendar-toolbar">
        <button id="calendar-prev" class="calendar-nav" type="button" aria-label="前の月">＜</button>
        <h2 id="calendar-month" aria-live="polite"></h2>
        <button id="calendar-next" class="calendar-nav" type="button" aria-label="次の月">＞</button>
      </div>
      <button id="calendar-today" class="calendar-today" type="button">今日</button>
      <div class="calendar-weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
      <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="calendar-month"></div>
      <section class="calendar-summary" aria-labelledby="week-tasks-heading">
        <h3 id="week-tasks-heading">今週タスク</h3>
        <div id="week-task-list"></div>
      </section>
      <section class="calendar-summary" aria-labelledby="selected-day-heading">
        <h3 id="selected-day-heading">選択日の予定</h3>
        <div id="selected-day-list"></div>
      </section>
    </section>
    <section class="diagnostic-section" aria-labelledby="diagnostic-heading">
      <button id="diagnostic-toggle" class="diagnostic-toggle" type="button" aria-expanded="false" aria-controls="diagnostic-panel">音声認識の診断</button>
      <div id="diagnostic-panel" class="diagnostic-panel" hidden>
        <div class="notification-test">
          <div class="notification-actions">
            <button id="notification-test-button" type="button">通知をテスト</button>
            <button id="push-subscribe-button" type="button">この端末を通知登録</button>
          </div>
          <p id="notification-test-result" role="status" aria-live="polite"></p>
          <p id="push-subscribe-result" role="status" aria-live="polite"></p>
        </div>
        <h2 id="diagnostic-heading">音声認識 診断ログ</h2>
        <pre id="diagnostic-log">録音を開始すると、ここに認識イベントが表示されます。</pre>
      </div>
    </section>  </main>

  <template id="memo-template">
    <article class="memo-card">
      <div class="memo-card-top"><time class="memo-date"></time><button class="status-button" type="button"></button></div>
      <div class="memo-attributes"><span class="due-badge"></span><span class="priority-badge"></span><span class="category-badge"></span></div>
      <p class="memo-text"></p>
      <textarea class="edit-textarea" rows="4" aria-label="メモ本文を編集" hidden></textarea>
      <div class="edit-task-fields" hidden>
        <label>期限<select class="edit-due"><option value="none">期限なし</option><option value="today">今日</option><option value="tomorrow">明日</option><option value="this_week">今週</option><option value="custom">日時指定</option></select></label>
        <label class="edit-period-label">時間帯<select class="edit-due-period"><option value="all_day">指定なし</option><option value="morning">午前</option><option value="afternoon">午後</option><option value="exact">時刻指定</option></select></label>
        <label class="edit-time-label" hidden>時刻<input class="edit-due-time" type="time" step="60"></label>
        <label class="edit-custom-date-label" hidden>日付<input class="edit-custom-date" type="date"></label>
        <label class="edit-custom-time-label" hidden>時刻（任意）<input class="edit-custom-time" type="time" step="60"></label>
        <label>優先度<select class="edit-priority"><option value="urgent">急ぎ</option><option value="normal">通常</option><option value="low">低め</option></select></label>
        <label>種別<select class="edit-category"><option value="repair">修理</option><option value="estimate">見積</option><option value="visit">訪問</option><option value="inspection">点検</option><option value="contact">連絡</option><option value="order">発注</option><option value="other">その他</option></select></label>
      </div>
      <div class="memo-actions">
        <button class="edit-button" type="button">編集</button>
        <button class="delete-button" type="button" aria-label="このメモを削除"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>削除</button>
      </div>
      <div class="edit-actions" hidden><button class="cancel-edit-button" type="button">キャンセル</button><button class="save-edit-button" type="button">変更を保存</button></div>
    </article>
  </template>
  <script src="voice-parser.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
